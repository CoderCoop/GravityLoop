# Put every planet and moon in motion, one runner per level, then commit the
# updated src/levels.js. Each job picks the fastest per-set orbit speed that
# keeps its level winnable (tools/orbits.js verifies with the real solver).
name: Add orbits
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: add-orbits-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        run: |
          node -e '
            const levels = Array.from({ length: 50 }, (_, i) => ({ level: i }));
            console.log("matrix=" + JSON.stringify({ include: levels }));
          ' >> "$GITHUB_OUTPUT"
  orbit:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: orbit L${{ matrix.level }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/orbits.js --level=${{ matrix.level }} --out=out/orbit-${{ matrix.level }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-${{ matrix.level }}
          path: out/
  apply:
    needs: [plan, orbit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: orbit-*
          path: orbits
          merge-multiple: true
      - name: Apply orbits and verify
        run: |
          node tools/orbits.js --apply=orbits
          node tools/solve.js --fast
      - name: Commit levels.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/levels.js
          if git diff --cached --quiet; then
            echo "levels.js unchanged"
          else
            git commit -m "Set every planet and moon in motion (solver-verified speeds)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
