name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  levels-solvable:
    name: All levels winnable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Brute-force solver over every level
        run: node tools/solve.js --fast

  changelog:
    name: Release notes accompany visible changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Changelog bumped when the player can see the change
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          CHANGELOG_BASE="origin/${{ github.base_ref }}" node tools/changelog-check.mjs

  invariants:
    name: Physics invariants hold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Outcome/geometry agreement, determinism, metamorphic properties
        run: node tools/invariants.mjs

  contract:
    name: Drawn scene matches the simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Silhouettes, docking rings, surface placement, preview legibility
        run: CHROMIUM_PATH="$(command -v google-chrome || command -v chromium-browser || command -v chromium)" node tools/contract-test.mjs

  ui-layout:
    name: UI fits all viewports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: HUD overflow check at phone/tablet/desktop sizes
        run: CHROMIUM_PATH="$(command -v google-chrome || command -v chromium-browser || command -v chromium)" node tools/ui-test.mjs
